name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: cards_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d cards_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: isolated-ci-password
      DB_NAME: cards_test
      JWT_SECRET: isolated-ci-signing-secret-not-for-any-deployment
      MAIL_HOST: unused.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test
      - run: sh -n deploy/backup.sh deploy/restore-check.sh
